name: Create a Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # matches tags like "v1.2.3"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # matches tags like "v1.2.3-alpha.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight release

jobs:
  release:
    name: create a release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all history
          fetch-tags: true
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run git cliff command
        env:
          TAG: ${{ github.ref_name }}
        shell: nix shell --inputs-from . nixpkgs#git-cliff --quiet --command bash {0}
        run: |
          if [[ $TAG =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git-cliff --latest -o CHANGELOG.md
          elif [[ $TAG =~ ^v?[0-9]+.[0-9]+.[0-9]+-.*$ ]]; then
            git-cliff --latest --tag-pattern "" -o CHANGELOG.md
          fi
      - name: Create a release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --prerelease \
            --latest=false
